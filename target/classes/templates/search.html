<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .search-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .search-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .search-container input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .search-container button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .search-container button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="search-container">
    <h1>Sentiment Search</h1>
    <form action="#" th:action="@{/api/sentimentData}" method="get">
        <label for="field1">Ticker :</label>
        <input type="text" id="field1" name="ticker" th:value="${ticker}" required>
        <label for="field2">Date Time :</label>
        <input type="text" id="field2" name="dateTime" th:value="${currentDateTime}" required>
        <button type="submit">Search</button>
    </form>
</div>
</body>
</html>
